name: Deploy to Netlify

# GitHub Pages already builds and serves this repo on every push, for free, at
# https://sandeshwar.github.io/vicaro-public/ — including install.sh and the
# 38 MB downloads. This Netlify workflow was therefore a second, paid copy of the
# same site: 19 production deploys in five days, each shipping 76 MB, on top of
# the bandwidth every install costs.
#
# It is now manual only. Run it from the Actions tab if Netlify has to be updated
# before the domain moves to Pages. Once the domain points at Pages, delete this
# file and the two Netlify secrets.
on:
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --prod --dir .
